<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>キープ依頼を書く</title>
<!--
  LINE のグループから開く「選ぶ画面」（LIFF）。ボタンを選んで依頼の文を組み立て、
  liff.sendMessages で「その人自身の書き込み」としてグループに送る。あとはボットがいつもどおりカードを返す。
  ボットからグループへ送る（push）と人数分の料金がかかるので、本人の書き込みにしている。
  選択肢は config.js。?mock=1 で LINE なしの見本（送る文を画面に出すだけ）。
-->
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --sub: #5d6676; --line: #dde1e8;
  --accent: #0f766e; --accent-t: #ffffff; --accent-soft: #e3f4f1;
  --warn: #9a5b00; --warn-soft: #fff3df; --err: #b42318; --err-soft: #fdeceb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --card: #1e232c; --text: #eef0f4; --sub: #a3acba; --line: #333a46;
    --accent: #3cc4ae; --accent-t: #062420; --accent-soft: #15332e;
    --warn: #f0b35a; --warn-soft: #3a2c14; --err: #ff8a80; --err-soft: #3b1d1b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; font-size: 16px; }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px 200px; }
h1 { font-size: 18px; margin: 4px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.q { font-size: 14px; font-weight: 700; color: var(--sub); margin: 0 0 8px; }
.q small { font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: var(--text); }
.chip { min-height: 48px; min-width: 64px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card); font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-t); font-weight: 700; }
input { font: inherit; width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--text); min-height: 48px; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.toggle input { width: 24px; height: 24px; min-height: 0; }
.preview { white-space: pre-wrap; font-size: 15px; line-height: 1.55; background: var(--accent-soft);
  border-radius: 10px; padding: 10px 12px; margin: 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 560px; margin: 0 auto; }
.send { width: 100%; min-height: 56px; border: none; border-radius: 14px; background: var(--accent); color: var(--accent-t);
  font-size: 18px; font-weight: 700; }
.send:disabled { opacity: .45; }
.hint { color: var(--warn); font-size: 13px; min-height: 18px; margin: 0 0 6px; text-align: center; }
.msg { border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 15px; }
.msg.err { background: var(--err-soft); color: var(--err); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.ok { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.mock { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 12px; padding: 4px; }
.center { text-align: center; color: var(--sub); padding: 60px 0; }
.diag { color: var(--sub); font-size: 11px; text-align: center; margin: 16px 0 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="mockbar" class="mock" hidden>見本の表示です（LINE には送られません）</div>
<main id="app"><p class="center">LINE に接続しています…</p></main>
<div class="bar" id="bar" hidden>
  <div class="in">
    <p class="hint" id="hint"></p>
    <button class="send" id="send" type="button" disabled>グループに送る</button>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.APP_CONFIG || {};
  var MOCK = /[?&]mock=1/.test(location.search);
  var app = document.getElementById('app');
  var bar = document.getElementById('bar');
  var sendBtn = document.getElementById('send');
  var hint = document.getElementById('hint');
  var canSend = false;

  var state = {
    item: null, motor: null, width: null, length: null, extras: [], wc: null, count: '1台',
    otherName: '', customer: '', date: null, dateValue: '', memo: '', proxy: false, proxyName: '',
  };

  /* ---------- 小さな道具 ---------- */
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'onclick' || k === 'oninput' || k === 'onchange') e[k] = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function msg(kind, text) { return el('div', { class: 'msg ' + kind, text: text }); }
  // 困ったときに岡本さんへ伝えてもらう小さな表示（画面の版と、どこから開いたか）
  var VERSION = 'v1.1';
  function setDiag(s) {
    diagText = '画面 ' + VERSION + '・' + s;
    var d = document.getElementById('diag');
    if (!d) { d = el('p', { id: 'diag', class: 'diag' }); app.appendChild(d); }
    d.textContent = diagText;
  }
  var diagText = '';
  function show(nodes) {
    app.innerHTML = '';
    nodes.forEach(function (n) { app.appendChild(n); });
    if (diagText) app.appendChild(el('p', { id: 'diag', class: 'diag', text: diagText }));
  }
  function readNames() { try { return JSON.parse(localStorage.getItem('keep_proxy_names_v1') || '[]'); } catch (e) { return []; } }
  function saveName(n) {
    try {
      var list = readNames().filter(function (x) { return x !== n; });
      list.unshift(n);
      localStorage.setItem('keep_proxy_names_v1', JSON.stringify(list.slice(0, 8)));
    } catch (e) { /* 保存できなくても送るのは続ける */ }
  }

  /* ---------- 日付 ---------- */
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
  function dayAfter(n) { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d; }
  function dateText() {
    if (state.date === '今日') return '今日 ' + md(dayAfter(0));
    if (state.date === '明日') return '明日 ' + md(dayAfter(1));
    if (state.date === 'あさって') return 'あさって ' + md(dayAfter(2));
    if (state.date === '日付') {
      if (!state.dateValue) return '';
      var p = state.dateValue.split('-').map(Number);
      return md(new Date(p[0], p[1] - 1, p[2], 12));
    }
    if (state.date === '未定') return '未定';
    return '';
  }

  /* ---------- 送る文 ---------- */
  function kind() {
    var it = (CFG.ITEMS || []).filter(function (x) { return x.label === state.item; })[0];
    return it ? it.kind : null;
  }
  function honor(name) {
    name = name.trim();
    if (!name) return '';
    return /(様|さま|さん)$/.test(name) ? name : name + '様';
  }
  function compose() {
    var k = kind();
    var head = '【キープ依頼】';
    if (state.proxy && state.proxyName.trim()) head += '（' + state.proxyName.trim().replace(/さん$/, '') + 'さんより）';
    var lines = [head + honor(state.customer)];
    var what = [];
    if (k === 'other') what.push(state.otherName.trim() || 'その他');
    else if (state.item) what.push(state.item);
    if (k === 'bed') [state.motor, state.width, state.length].forEach(function (v) { if (v) what.push(v); });
    if (k === 'mattress') [state.width, state.length].forEach(function (v) { if (v) what.push(v); });
    if (k === 'wheelchair' && state.wc) what.push(state.wc);
    if (state.count && state.count !== '1台') what.push('×' + state.count);
    lines.push(what.join(' '));
    if (k === 'bed' && state.extras.length) lines.push('付属：' + state.extras.join('・'));
    var dt = dateText();
    if (dt) lines.push('納品：' + dt);
    if (state.memo.trim()) lines.push('メモ：' + state.memo.trim());
    return lines.join('\n');
  }
  function missing() {
    if (!state.item) return '商品を選んでください';
    if (kind() === 'other' && !state.otherName.trim()) return '商品名を書いてください';
    if (!state.customer.trim()) return 'お客様名を書いてください';
    if (state.date === '日付' && !state.dateValue) return '納品の日付を選んでください';
    if (state.proxy && !state.proxyName.trim()) return 'だれの依頼かを入れてください';
    return '';
  }

  /* ---------- 画面 ---------- */
  function chips(values, isOn, onPick) {
    return el('div', { class: 'chips' }, values.map(function (v) {
      return el('button', { class: 'chip', type: 'button', 'aria-pressed': String(!!isOn(v)), onclick: function () { onPick(v); render(); } }, [v]);
    }));
  }
  function single(key) {
    return function (v) { state[key] = state[key] === v ? null : v; };
  }
  function section(title, body) { return el('div', { class: 'card' }, [el('p', { class: 'q' }, title), body]); }
  function textInput(key, placeholder, type) {
    var i = el('input', { type: type || 'text', placeholder: placeholder || '', value: state[key] || '' });
    i.value = state[key] || '';
    i.oninput = function () { state[key] = i.value; refresh(); };
    return i;
  }

  function render() {
    var k = kind();
    var nodes = [el('h1', { text: 'キープ依頼を書く' })];
    nodes.push(section(['商品'], chips(CFG.ITEMS.map(function (x) { return x.label; }),
      function (v) { return state.item === v; },
      function (v) { state.item = state.item === v ? null : v; })));
    if (k === 'other') nodes.push(section(['商品名'], textInput('otherName', '例：歩行器 ○○')));
    if (k === 'bed') {
      nodes.push(section(['モーター ', el('small', { text: '（選ばなければ指定なし）' })],
        chips(CFG.MOTOR, function (v) { return state.motor === v; }, single('motor'))));
    }
    if (k === 'bed' || k === 'mattress') {
      nodes.push(section(['幅'], chips(CFG.WIDTH, function (v) { return state.width === v; }, single('width'))));
      nodes.push(section(['長さ'], chips(CFG.LENGTH, function (v) { return state.length === v; }, single('length'))));
    }
    if (k === 'bed') {
      nodes.push(section(['付属 ', el('small', { text: '（いくつでも）' })], chips(CFG.BED_EXTRAS,
        function (v) { return state.extras.indexOf(v) >= 0; },
        function (v) {
          var i = state.extras.indexOf(v);
          if (i >= 0) state.extras.splice(i, 1); else state.extras.push(v);
        })));
    }
    if (k === 'wheelchair') {
      nodes.push(section(['車いす'], chips(CFG.WHEELCHAIR, function (v) { return state.wc === v; }, single('wc'))));
    }
    if (k) nodes.push(section(['数'], chips(CFG.COUNT, function (v) { return state.count === v; }, function (v) { state.count = v; })));

    nodes.push(section(['お客様名'], textInput('customer', '例：山田')));

    var dateBox = el('div', {}, [chips(['今日', '明日', 'あさって', '日付', '未定'],
      function (v) { return state.date === v; }, single('date'))]);
    if (state.date === '日付') {
      var di = el('input', { type: 'date' });
      di.value = state.dateValue;
      di.onchange = function () { state.dateValue = di.value; refresh(); };
      dateBox.appendChild(el('div', { class: 'row' }, [di]));
    }
    nodes.push(section(['納品'], dateBox));
    nodes.push(section(['メモ ', el('small', { text: '（書きたいときだけ）' })], textInput('memo', '例：午前中に出したい')));

    // 電話・FAX で受けた人が、営業の代わりに書くとき
    var proxyBox = el('div', {});
    var cb = el('input', { type: 'checkbox' });
    cb.checked = state.proxy;
    cb.onchange = function () { state.proxy = cb.checked; render(); };
    proxyBox.appendChild(el('label', { class: 'toggle' }, [cb, '電話・FAXで受けた（ほかの人の依頼を代わりに書く）']));
    if (state.proxy) {
      var names = readNames();
      if (names.length) {
        proxyBox.appendChild(chips(names, function (v) { return state.proxyName === v; },
          function (v) { state.proxyName = state.proxyName === v ? '' : v; }));
      }
      proxyBox.appendChild(el('div', { class: 'row' }, [textInput('proxyName', 'だれの依頼か（例：田中）')]));
    }
    nodes.push(el('div', { class: 'card' }, [proxyBox]));

    var pv = el('pre', { class: 'preview', id: 'preview' });
    nodes.push(section(['グループに送る文'], pv));
    show(nodes);
    bar.hidden = false;
    refresh();
  }

  // 入力のたびに作り直すと文字入力が途切れるので、送る文とボタンだけ直す
  function refresh() {
    var pv = document.getElementById('preview');
    if (pv) pv.textContent = compose();
    var m = missing();
    hint.textContent = canSend ? m : hint.textContent;
    sendBtn.disabled = !canSend || !!m;
  }

  sendBtn.onclick = function () {
    if (missing() || !canSend) return;
    var text = compose();
    sendBtn.disabled = true;
    sendBtn.textContent = '送っています…';
    liff.sendMessages([{ type: 'text', text: text }]).then(function () {
      if (state.proxy && state.proxyName.trim()) saveName(state.proxyName.trim().replace(/さん$/, ''));
      bar.hidden = true;
      show([msg('ok', 'グループに送りました。ボットのカードが届きます。'), el('pre', { class: 'preview', text: text })]);
      setTimeout(function () { try { liff.closeWindow(); } catch (e) { /* 閉じられなくてもよい */ } }, 900);
    }).catch(function (e) {
      sendBtn.disabled = false;
      sendBtn.textContent = 'グループに送る';
      hint.textContent = sendErrorText(e);
    });
  };

  // 送れなかった理由（LINE の説明より）。403 はほぼ「トークへの送信の許可がない」か「開き方」
  function sendErrorText(e) {
    var code = String((e && e.code) || '');
    var raw = (e && e.message) || String(e);
    if (code === '403' || code === 'FORBIDDEN' || /permission|403/i.test(raw)) {
      return '送れませんでした：LINE の許可（トークへの送信）がまだか、開き方が違います。'
        + 'いったん閉じて、グループの「ボタン」かアナウンスのリンクから開き直してください。'
        + '（最近使ったサービスから開くと送れません）だめなら文字でグループに書いてください。［' + code + '］';
    }
    return '送れませんでした。もう一度押すか、文字でグループに書いてください［' + (code || '-') + '：' + raw + '］';
  }

  // トークへの送信の許可。LIFF の設定に chat_message.write が無いと unavailable、許可がまだなら prompt
  function checkPermission() {
    if (!liff.permission || !liff.permission.query) return Promise.resolve('unknown');
    return liff.permission.query('chat_message.write')
      .then(function (r) { return (r && r.state) || 'unknown'; })
      .catch(function () { return 'unknown'; });
  }

  /* ---------- 起動 ---------- */
  function loadLiff() {
    return new Promise(function (ok, ng) {
      var s = document.createElement('script');
      s.src = 'https' + ':' + '//static.line-scdn.net/liff/edge/2/sdk.js';
      s.charset = 'utf-8';
      s.onload = ok;
      s.onerror = function () { ng(new Error('LINE の部品を読み込めませんでした。電波のよい所でもう一度開いてください')); };
      document.head.appendChild(s);
    });
  }

  function mockLiff() {
    var ctx = (/[?&]ctx=(\w+)/.exec(location.search) || [])[1] || 'group';
    window.__sent = [];
    window.liff = {
      init: function () { return Promise.resolve(); },
      isInClient: function () { return ctx !== 'external'; },
      getContext: function () { return { type: ctx }; },
      sendMessages: function (m) {
        if (/[?&]fail=403/.test(location.search)) {
          var f = new Error('user doesn\'t grant required permissions yet'); f.code = '403'; return Promise.reject(f);
        }
        if (/[?&]fail=1/.test(location.search)) return Promise.reject(new Error('見本：送信に失敗'));
        window.__sent.push(m); return Promise.resolve();
      },
      permission: {
        query: function () {
          return Promise.resolve({ state: (/[?&]perm=(\w+)/.exec(location.search) || [])[1] || 'granted' });
        },
      },
      closeWindow: function () { window.__closed = true; },
    };
    document.getElementById('mockbar').hidden = false;
    return Promise.resolve();
  }

  function start() {
    var p;
    if (MOCK) p = mockLiff();
    else if (!CFG.LIFF_ID) {
      show([msg('err', 'この画面はまだ準備中です（LIFF ID が未設定）。')]);
      return;
    } else p = loadLiff().then(function () { return liff.init({ liffId: CFG.LIFF_ID }); });

    p.then(function () {
      var ctx = (liff.getContext && liff.getContext()) || {};
      if (!liff.isInClient()) {
        show([msg('warn', 'LINE の中で開いてください。グループのトークに貼ってあるリンクから開くと、そのグループに送れます。')]);
        return;
      }
      canSend = ctx.type === 'group' || ctx.type === 'room' || ctx.type === 'utou';
      render();
      setDiag('トーク：' + (ctx.type || '-'));
      if (!canSend) {
        hint.textContent = 'グループのトークのリンクから開いてください（ここからはどのトークに送るか分かりません）';
        sendBtn.disabled = true;
        return;
      }
      return checkPermission().then(function (perm) {
        setDiag('トーク：' + ctx.type + '・許可：' + perm);
        if (perm === 'unavailable') {
          canSend = false;
          sendBtn.disabled = true;
          hint.textContent = 'この画面の設定に「トークへの送信」が入っていません（LIFF の Scope に chat_message.write）。岡本さんに伝えてください';
        } else if (perm === 'prompt') {
          hint.textContent = 'LINE の許可（トークへの送信）がまだです。送れないときは、閉じて開き直し、許可の画面で「許可する」を押してください';
        }
      });
    }).catch(function (e) {
      show([msg('err', '開けませんでした：' + ((e && e.message) || e))]);
    });
  }

  start();
})();
</script>
</body>
</html>
